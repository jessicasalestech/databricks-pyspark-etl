[project]
name = "databricks-pyspark-etl"
version = "1.0.0"
description = "Databricks / PySpark Medallion-architecture ETL pipeline with tests and CI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyspark>=3.5.0", "pandas>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]